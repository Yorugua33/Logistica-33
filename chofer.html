<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery 33 - Portal Chofer 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.8));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header Chofer -->
    <header class="glass-3d sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-orange-500/30">
        <div class="flex items-center space-x-3">
            <div class="bg-orange-500 text-white font-extrabold text-xl px-3 py-1.5 rounded-xl shadow-lg">D33</div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-white">Portal <span class="text-orange-500">Chofer</span></h1>
                <p class="text-xs text-slate-400">Modo Conductor Activo (Andrés / Nahuel)</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> En Ruta
            </span>
        </div>
    </header>

    <main class="flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
        <!-- Tarjeta de Estado del Repartidor -->
        <div class="glass-3d p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-lg font-bold text-white">Hola, Andrés 👋</h2>
                <p class="text-xs text-slate-400">Zona actual: Pinamar Norte / Ostende</p>
                <div class="mt-3 flex gap-2">
                    <span class="text-xs bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">Comisión: 17%</span>
                    <span class="text-xs bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">Viajes hoy: 8</span>
                </div>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="toggleStatus()" id="btn-status" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-5 py-3 rounded-xl transition shadow-lg">Disponible</button>
            </div>
        </div>

        <!-- Mapa de Ruta Asignada -->
        <div class="glass-3d p-5 rounded-2xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-orange-400 mb-3">Mapa de Destino Activo</h2>
            <div id="driver-map" class="w-full h-64 rounded-xl border border-slate-700 z-10"></div>
        </div>

        <!-- Pedidos Asignados Pendientes de Entrega -->
        <div class="glass-3d p-5 rounded-2xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-orange-400 mb-3">Mis Pedidos Asignados (IndexedDB)</h2>
            <div id="driver-orders" class="space-y-3">
                <!-- Se llena mediante JS -->
            </div>
        </div>
    </main>

    <script>
        // Mapa Chofer
        const map = L.map('driver-map').setView([-37.1042, -56.8659], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const marker = L.marker([-37.1042, -56.8659]).addTo(map).bindPopup("Tu ubicación GPS actual").openPopup();

        // IndexedDB Sync
        let db;
        const request = indexedDB.open("Delivery33DB", 1);
        request.onsuccess = (e) => {
            db = e.target.result;
            loadDriverOrders();
        };

        function loadDriverOrders() {
            if (!db) return;
            const container = document.getElementById('driver-orders');
            container.innerHTML = '';
            const tx = db.transaction(["orders"], "readonly");
            const store = tx.objectStore("orders");
            const req = store.openCursor();

            req.onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const o = cursor.value;
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center text-xs">
                            <div>
                                <span class="text-orange-400 font-bold">[${o.rubro}]</span> <b>${o.cliente}</b>
                                <div class="text-slate-400 mt-1">Total: $${o.monto} | Comisión 17%: $${o.commission.toFixed(1)}</div>
                            </div>
                            <button onclick="completeOrder(${cursor.key})" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-xl font-bold transition">Entregar</button>
                        </div>
                    `;
                    cursor.continue();
                }
            };
        }

        function completeOrder(id) {
            const tx = db.transaction(["orders"], "readwrite");
            const store = tx.objectStore("orders");
            store.delete(id);
            tx.oncomplete = () => {
                alert("¡Pedido entregado con éxito!");
                loadDriverOrders();
            };
        }

        function toggleStatus() {
            const btn = document.getElementById('btn-status');
            if(btn.innerText === "Disponible") {
                btn.innerText = "En Pausa";
                btn.className = "flex-1 md:flex-none bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-5 py-3 rounded-xl transition shadow-lg";
            } else {
                btn.innerText = "Disponible";
                btn.className = "flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-5 py-3 rounded-xl transition shadow-lg";
            }
        }
    </script>
</body>
</html>
