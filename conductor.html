let map,mk={},fitK='';
function iniMapa(){if(!window.L)return $('map').innerHTML='<p style="padding:20px">El mapa necesita conexión a internet.</p>';

function pintar(){if(!map)return;const vivos={};
 const MIS=S.vi.filter(v=>(v.est=='pend'||v.est=='curso')&&v.lat);
 S.ch.filter(c=>c.est!='off'&&c.lat&&(!ROL||(ROL=='chofer'&&c.id==ui.ch)||(ROL=='pasajero'&&MIS.some(v=>v.ch==c.id)))).forEach(c=>vivos['c'+c.id]=[c.lat,c.lng,c.est=='viaje'?'#ff6b1a':'#2ee59d','🏍️',c.mv+' · '+c.n+(c.cola?' · '+c.cola+' Nº'+(cola(c.cola).findIndex(x=>x.id==c.id)+1):'')]);
 if(ROL=='pasajero')MIS.filter(v=>v.dlat).forEach(v=>vivos['c'+v.ch]=[v.dlat,v.dlng,'#ff6b1a','🏍️',(v.dm||'')+' · '+(v.dn||'')]);
 MIS.forEach(v=>vivos['p'+v.id]=[v.lat,v.lng,'#2fd6ff','🧍',v.pn+' · '+v.or]);
 Object.keys(mk).forEach(k=>{if(!vivos[k]){map.removeLayer(mk[k]);delete mk[k]}});
 Object.entries(vivos).forEach(([k,d])=>{if(mk[k]){mk[k].setLatLng([d[0],d[1]]);mk[k].setTooltipContent(d[4])}else mk[k]=L.marker([d[0],d[1]],{icon:L.divIcon({className:'',iconSize:[30,30],html:`<div class="pin" style="background:${d[2]};--pc:${d[2]}99">${d[3]}</div>`})}).addTo(map).bindTooltip(d[4])});
